name: Build G Wallet Alternative

on:
  workflow_dispatch: # Manual button trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Inject Custom Name Safely
      run: |
        # Safely inject G Wallet into the main app module's build configuration
        sed -i '/defaultConfig {/a \        resValue("string", "app_name", "G Wallet")' app/build.gradle.kts

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: G-Wallet-New-Installer
        path: "**/build/outputs/apk/debug/*.apk"
