name: Build G Wallet Alternative

on:
  workflow_dispatch: # Manual play button trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Inject Global Override Configuration
      run: |
        # Append an explicit build features block to the absolute bottom of the app configuration file
        cat << 'EOF' >> app/build.gradle.kts
        
        android {
            buildFeatures {
                resValues = true
            }
            defaultConfig {
                resValue("string", "app_name", "G Wallet")
            }
        }
        EOF

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: G-Wallet-New-Installer
        path: "**/build/outputs/apk/debug/*.apk"
